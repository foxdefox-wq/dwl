name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    permissions:
      contents: write # Required to create/update releases

    steps:
    - name: Prepare Container Environment
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git patch

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply Patches
      run: |
        if [ -d "patches" ] && [ "$(ls -A patches)" ]; then
          echo "Applying patches..."
          for patch_file in patches/*; do
            echo "Applying $patch_file..."
            patch -p1 < "$patch_file"
          done
        else
          echo "No patches found or patches directory does not exist. Skipping."
        fi

    # Fixed Step: Uses natively available wlroots0.20 from Arch main repositories
    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          pkgconf \
          libinput \
          wayland \
          libxkbcommon \
          wayland-protocols \
          wlroots0.20 \
          xorg-xwayland \
          libxcb \
          xcb-util-wm \
          pixman \
          fcft

    # Fixed Step: Forcibly targets wlroots-0.20 instead of a missing 0.19 target
    - name: Target Newest wlroots Version
      run: |
        if grep -q "wlroots-0.19" Makefile; then
          sed -i 's/wlroots-0.19/wlroots-0.20/g' Makefile
        elif grep -q "wlroots-0.19" config.mk; then
          sed -i 's/wlroots-0.19/wlroots-0.20/g' config.mk
        fi

    - name: Enable XWayland
      run: |
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk
        sed -i 's/#XLIBS/XLIBS/g' config.mk

    - name: Run Make
      run: make

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
