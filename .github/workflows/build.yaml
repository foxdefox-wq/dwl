name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
    - name: Install Dependencies & Build
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm base-devel git pkgconf libinput wayland \
          libxkbcommon wayland-protocols xorg-xwayland libxcb \
          xcb-util-wm pixman fcft tllist wlroots
        
        # Checkout and build
        git clone ${{ github.server_url }}/${{ github.repository }} .
        
        # Apply patches if any
        [ -d "patches" ] && for p in patches/*; do patch -p1 < "$p"; done
        
        # Build - using whatever wlroots version is in the repo
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk
        sed -i 's/#XLIBS/XLIBS/g' config.mk
        make

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}