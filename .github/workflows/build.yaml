name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest-16-cores

    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            wayland \
            wayland-protocols \
            libinput \
            libxkbcommon \
            libdrm \
            pixman \
            libseat \
            wlroots-0.19

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply patches
        run: |
          if [ -d patches ] && [ "$(ls -A patches 2>/dev/null)" ]; then
            for patch_file in patches/*; do
              echo "Applying $patch_file..."
              patch -p1 < "$patch_file"
            done
          fi

      - name: Configure wlroots version
        run: |
          sed -i 's/wlroots-0\.20/wlroots/g' config.mk 2>/dev/null || true
          sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk 2>/dev/null || true

      - name: Build
        run: |
          make clean || true
          make

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build
          tag_name: latest
          files: dwl
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
