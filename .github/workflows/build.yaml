name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/djpohly/dwl:build

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply Patches
      run: |
        if [ -d "patches" ] && [ "$(ls -A patches 2>/dev/null)" ]; then
          for patch_file in patches/*; do
            echo "Applying $patch_file..."
            patch -p1 < "$patch_file"
          done
        fi

    - name: Build
      run: |
        make
        sed -i 's/wlroots-0.20/wlroots/g' config.mk 2>/dev/null || true
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk 2>/dev/null || true
        make

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
