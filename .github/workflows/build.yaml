name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Forces the job to run inside a rolling Arch Linux container environment
    container:
      image: archlinux:latest

    permissions:
      contents: write # Required to create/update releases

    steps:
    # 1. Prepare git and system prerequisites inside the container
    - name: Prepare Container Environment
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git patch

    # 2. Pull down your repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 3. Apply custom patches
    - name: Apply Patches
      run: |
        if [ -d "patches" ] && [ "$(ls -A patches)" ]; then
          echo "Applying patches..."
          for patch_file in patches/*; do
            echo "Applying $patch_file..."
            patch -p1 < "$patch_file"
          done
        else
          echo "No patches found or patches directory does not exist. Skipping."
        fi

    # 4. Install cutting-edge packages (wlroots 0.19+, fcft, pixman natively bundled)
    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          pkgconf \
          libinput \
          wayland \
          xorg-xkbcommon \
          wayland-protocols \
          wlroots \
          xorg-xwayland \
          libxcb \
          xcb-util-wm \
          pixman \
          fcft

    # 5. Enable XWayland in your local build settings
    - name: Enable XWayland
      run: |
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk
        sed -i 's/#XLIBS/XLIBS/g' config.mk

    # 6. Compile the binary using standard modern wayland-scanner arguments
    - name: Run Make
      run: make

    # 7. Upload to your rolling repository release assets
    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
