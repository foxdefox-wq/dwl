name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    permissions:
      contents: write # Required to create/update releases

    steps:
    - name: Prepare Container Environment
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm git patch

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply Patches
      run: |
        if [ -d "patches" ] && [ "$(ls -A patches)" ]; then
          echo "Applying patches..."
          for patch_file in patches/*; do
            echo "Applying $patch_file..."
            patch -p1 < "$patch_file"
          done
        else
          echo "No patches found or patches directory does not exist. Skipping."
        fi

    # Fixed Step: Corrected package names for the Arch environment
    - name: Install Dependencies
      run: |
        pacman -S --noconfirm \
          base-devel \
          pkgconf \
          libinput \
          wayland \
          libxkbcommon \
          wayland-protocols \
          wlroots0.19 \
          xorg-xwayland \
          libxcb \
          xcb-util-wm \
          pixman \
          fcft

    # Fix: Arch links versioned wlroots as wlroots-0.19.pc, but Makefile might query wlroots.pc
    - name: Link wlroots pkgconfig if required
      run: |
        if [ ! -f /usr/lib/pkgconfig/wlroots.pc ] && [ -f /usr/lib/pkgconfig/wlroots-0.19.pc ]; then
          ln -s /usr/lib/pkgconfig/wlroots-0.19.pc /usr/lib/pkgconfig/wlroots.pc
        fi

    - name: Enable XWayland
      run: |
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk
        sed -i 's/#XLIBS/XLIBS/g' config.mk

    - name: Run Make
      run: make

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
