name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    permissions:
      contents: write

    steps:
    - name: Install Dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm \
          base-devel \
          git \
          pkgconf \
          libinput \
          wayland \
          libxkbcommon \
          wayland-protocols \
          xorg-xwayland \
          libxcb \
          xcb-util-wm \
          pixman \
          fcft \
          tllist \
          ninja \
          cmake \
          meson

    - name: Build wlroots-0.19 from source
      run: |
        git clone --depth 1 --branch 0.19.0 https://gitlab.freedesktop.org/wlroots/wlroots.git
        cd wlroots
        meson setup build -Dexamples=false -Dxwayland=enabled -Dxcb-errors=disabled
        ninja -C build
        ninja -C build install
        cd ..
        echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply Patches
      run: |
        [ -d "patches" ] && [ "$(ls -A patches 2>/dev/null)" ] && \
          for patch_file in patches/*; do patch -p1 < "$patch_file"; done || \
          echo "No patches found"

    - name: Configure Build
      run: |
        # Use wlroots from /usr/local (where we installed it)
        sed -i 's|wlroots-0.20|wlroots|g' config.mk 2>/dev/null || true
        sed -i 's|wlroots-0.19|wlroots|g' config.mk 2>/dev/null || true
        sed -i 's|wlroots-0.20|wlroots|g' Makefile 2>/dev/null || true
        sed -i 's|wlroots-0.19|wlroots|g' Makefile 2>/dev/null || true
        
        # Enable XWayland if needed
        sed -i 's/#XWAYLAND/XWAYLAND/g' config.mk 2>/dev/null || true
        sed -i 's/#XLIBS/XLIBS/g' config.mk 2>/dev/null || true

    - name: Build dwl
      run: |
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
        make

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Latest Build"
        tag_name: "latest"
        files: dwl
        prerelease: true
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}